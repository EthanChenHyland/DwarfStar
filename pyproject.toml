[project]
name = "dwarfstar"
version = "1.0.0"
description = "A local Apple-Silicon workstation for large mixture-of-experts models"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["agent-tools/node_modules", "acp/vendor", "local-data"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F403", "F405", "F401"]

[tool.ruff.lint.per-file-ignores]
"benchmark-runner/*" = ["E402", "F841"]
"agent-tools/*" = ["E402"]
"scripts/*" = ["E402"]
