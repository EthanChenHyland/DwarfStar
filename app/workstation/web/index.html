<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DwarfStar Workstation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Sections">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <circle cx="16" cy="16" r="5.5" fill="var(--accent)"/>
        <circle cx="16" cy="16" r="11" fill="none" stroke="var(--accent)" stroke-opacity=".35" stroke-width="1.2"/>
        <circle cx="27" cy="16" r="1.6" fill="var(--accent)"/>
      </svg>
      <div><b>DwarfStar</b><span>Workstation</span></div>
    </div>
    <button data-view="chats"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>Chats</button>
    <button data-view="run"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M6.8 5.8l3 2.2-3 2.2z"/></svg>Run</button>
    <button data-view="models"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l5.5 3v6L8 14l-5.5-3V5z"/><path d="M2.5 5L8 8l5.5-3M8 8v6"/></svg>Models</button>
    <button data-view="live" data-also="visualizer"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5h3l1.5-4 3 7 1.5-3h4"/></svg>Live</button>
    <button data-view="diagnostics"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13.5V8.5M8 13.5v-11M13 13.5V6"/></svg>Diagnostics</button>
    <button data-view="settings"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4"/></svg>Settings</button>
    <button class="nav-status" id="nav-status" title="Run">
      <span class="dot" id="nav-dot"></span>
      <div><b id="nav-model">No model running</b><span id="nav-phase">Offline</span></div>
    </button>
    <button class="palette-hint" id="palette-open" title="Command palette"><kbd>⌘K</kbd>Commands</button>
  </nav>
  <main id="main" tabindex="-1">
    <section id="view-run" class="view active"></section>
    <section id="view-chats" class="view"></section>
    <section id="view-models" class="view"></section>
    <section id="view-live" class="view"></section>
    <section id="view-visualizer" class="view"></section>
    <section id="view-diagnostics" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script src="visualizer.js"></script>
<script src="chats.js"></script>
<script src="diagnostics.js"></script>
<script src="palette.js"></script>
</body>
</html>
