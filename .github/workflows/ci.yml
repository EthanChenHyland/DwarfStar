# DwarfStar pull-request checks. No model weights, no runtime, no inference: everything here runs against the repository,
# temporary data roots and fixtures, so a clean clone on a hosted runner exercises the same code paths a release does.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core:
    # The product targets Apple Silicon macOS; unit, catalog, migration, storage, backup and telemetry-schema tests run
    # there, against empty temporary roots.
    name: core (unit, catalog, generated config, migrations)
    runs-on: macos-latest  # Apple Silicon; a pinned image (macos-14) was retired out from under the workflow
    timeout-minutes: 15
    env:
      DWARFSTAR_ASSETS: ${{ github.workspace }}/.ci/assets
      DWARFSTAR_DATA: ${{ github.workspace }}/.ci/data
      DWARFSTAR_CACHE: ${{ github.workspace }}/.ci/cache
      DWARFSTAR_LOGS: ${{ github.workspace }}/.ci/logs
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use the runner's Python for bin/dwarfstar
        run: echo "DWARFSTAR_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Unit tests
        run: python -B -m unittest discover -s tests -t .
      - name: Catalog is valid
        run: bin/dwarfstar models > /dev/null && echo "catalog valid"
      - name: Generated configuration matches the catalog
        run: |
          bin/dwarfstar generate > /dev/null
          python -B -c "
          from dwarfstar import catalog, instance
          bad = {m: instance.check(m) for m in catalog.models() if instance.check(m)}
          assert not bad, bad
          print('generated configuration matches for', ', '.join(catalog.models()))
          "
      - name: Benchmark index structure
        run: bin/dwarfstar bench-index --structure

  static:
    name: static and security (syntax, lint, JS, hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: |
          python -B - <<'PY'
          import ast, pathlib
          roots = ("src", "agent-tools", "benchmark-runner", "scripts", "tests", "app")
          files = [p for r in roots for p in pathlib.Path(r).rglob("*.py") if "node_modules" not in p.parts]
          for path in files:
              ast.parse(path.read_text(), str(path))
          print(len(files), "files parse")
          PY
      - name: Lint (ruff)
        run: pip install --quiet "ruff==0.6.9" && ruff check .
      - name: JavaScript syntax
        run: for f in agent-tools/bin/*.mjs agent-tools/lib/*.mjs app/workstation/web/*.js; do node --check "$f"; done
      - name: Repository hygiene (large files, weights, secrets, home paths, chats)
        run: python -B scripts/validate/repo_hygiene.py

  docs:
    name: docs (links, known limitations)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation links
        run: python -B scripts/validate/doc_links.py
      - name: Known limitations are valid JSON with ids and text
        run: |
          python -B -c "
          import json
          rows = json.load(open('docs/known-limitations.json'))
          assert all({'id', 'models', 'text'} <= set(r) for r in rows), 'malformed limitation'
          assert len({r['id'] for r in rows}) == len(rows), 'duplicate limitation id'
          print(len(rows), 'limitations')
          "
